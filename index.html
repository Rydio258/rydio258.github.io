<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐主页 · 随机播放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 1.5rem;
            padding-bottom: 0;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #a5f3fc, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .subhead {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #334155;
            padding-bottom: 1rem;
            width: 100%;
        }

        .music-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.6);
            width: 100%;
            transition: transform 0.2s;
        }

        .now-playing {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0b1120;
            padding: 0.9rem 1.5rem;
            border-radius: 3rem;
            margin-bottom: 2rem;
            border: 1px solid #2d3a4f;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .disc-icon {
            font-size: 1.5rem;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
            display: inline-block;
        }

        .disc-icon.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .track-title {
            font-weight: 500;
            font-size: 1.15rem;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 3rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #3b4a5e;
            box-shadow: 0 6px 0 #0b1120;
            transform: translateY(0);
        }

        .btn:active {
            box-shadow: 0 2px 0 #0b1120;
            transform: translateY(4px);
        }

        .btn-play {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #3b82f6;
            box-shadow: 0 6px 0 #0e1a2b;
            color: white;
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .btn-stop {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            border-color: #ef4444;
            box-shadow: 0 6px 0 #2b0e0e;
            color: white;
        }

        .btn-stop:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #0b1120;
            transform: translateY(2px);
        }

        .hint {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #64748b;
            background: #0f172a;
            padding: 0.7rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid #1e293b;
            display: inline-block;
            max-width: 100%;
        }

        footer {
            margin-top: 3rem;
            padding: 1.2rem 0 1.5rem;
            border-top: 1px solid #1e293b;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            color: #64748b;
            font-size: 0.85rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            gap: 1rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .footer-links a:hover {
            color: #c084fc;
        }

        .copyright {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .music-card { padding: 1.5rem 1.2rem; }
            .btn { padding: 0.75rem 1.4rem; font-size: 0.95rem; }
            .controls { gap: 1rem; }
            .track-title { max-width: 150px; }
            footer { flex-direction: column; text-align: center; gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>🎧 我的音乐主页</h1>
        <div class="subhead">随机播放目录中的音乐</div>

        <div class="music-card">
            <div class="now-playing">
                <span class="disc-icon" id="discIcon">💿</span>
                <span class="track-title" id="trackTitle">未播放</span>
            </div>

            <div class="controls">
                <button class="btn btn-play" id="playBtn">
                    <span>▶</span> 播放
                </button>
                <button class="btn btn-stop" id="stopBtn" disabled>
                    <span>⏹</span> 停止
                </button>
            </div>

            <div class="hint" id="statusMessage">
                👆 点击「播放」开始随机音乐
            </div>
        </div>
    </div>

    <footer>
        <div class="copyright">
            <span>©</span> 2025 我的 GitHub 主页
        </div>
        <div class="footer-links">
            <a href="https://github.com/" target="_blank" rel="noopener">
                <span>🐙</span> GitHub
            </a>
            <a href="#" id="footerInfoLink">
                <span>ℹ️</span> 关于
            </a>
        </div>
    </footer>

    <!-- 音频元素，src 由 JavaScript 动态设置 -->
    <audio id="bgMusic" preload="auto"></audio>

    <script>
        (function() {
            // ==================== 音乐列表 ====================
            // 请把下面的路径改成你实际上传的音乐文件路径
            // 例如文件放在仓库的 music/ 文件夹下，就写 'music/歌曲名.mp3'
            const playlist = [
                'music/song1.mp3',
                'music/song2.mp3',
                'music/song3.mp3'
                // 可以继续添加...
            ];
            // =================================================

            const audio = document.getElementById('bgMusic');
            const playBtn = document.getElementById('playBtn');
            const stopBtn = document.getElementById('stopBtn');
            const trackTitle = document.getElementById('trackTitle');
            const discIcon = document.getElementById('discIcon');
            const statusMessage = document.getElementById('statusMessage');
            const footerInfoLink = document.getElementById('footerInfoLink');

            let isPlaying = false;
            let isUserTriggered = false; // 标记是否为用户点击触发

            // 从文件路径提取曲目名
            function getTrackName(path) {
                if (!path) return '未知曲目';
                const decoded = decodeURIComponent(path);
                const filename = decoded.split('/').pop() || '';
                const nameWithoutExt = filename.replace(/\.[^/.]+$/, '');
                return nameWithoutExt.replace(/[_-]/g, ' ') || '未命名曲目';
            }

            // 更新界面状态
            function updateUIForPlaying(playing) {
                isPlaying = playing;
                if (playing) {
                    discIcon.classList.add('playing');
                    playBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    discIcon.classList.remove('playing');
                    playBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            }

            // 设置状态提示
            function setStatus(text, isError = false) {
                statusMessage.innerHTML = text;
                statusMessage.style.color = isError ? '#f87171' : '#64748b';
            }

            // 随机获取一首曲目路径
            function getRandomTrack() {
                if (playlist.length === 0) return null;
                const randomIndex = Math.floor(Math.random() * playlist.length);
                return playlist[randomIndex];
            }

            // 播放随机音乐
            function playRandom(fromUser = false) {
                if (playlist.length === 0) {
                    setStatus('⚠️ 播放列表为空，请添加音乐文件', true);
                    return;
                }

                const track = getRandomTrack();
                if (!track) return;

                audio.src = track;
                const playPromise = audio.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // 播放成功
                        trackTitle.textContent = getTrackName(track);
                        updateUIForPlaying(true);
                        setStatus('🎵 正在播放：' + getTrackName(track), false);
                        isUserTriggered = false;
                    }).catch(error => {
                        // 播放失败
                        console.warn('播放失败:', error);
                        updateUIForPlaying(false);
                        if (fromUser) {
                            setStatus('❌ 播放失败，请检查文件路径或格式', true);
                        } else {
                            setStatus('👆 点击「播放」按钮开始随机音乐', false);
                        }
                    });
                } else {
                    // 老式浏览器
                    updateUIForPlaying(!audio.paused);
                    if (!audio.paused) {
                        trackTitle.textContent = getTrackName(track);
                        setStatus('🎵 正在播放', false);
                    }
                }
            }

            // 停止播放
            function stopAudio() {
                audio.pause();
                audio.currentTime = 0;
                updateUIForPlaying(false);
                trackTitle.textContent = '未播放';
                setStatus('⏸️ 已停止', false);
                isUserTriggered = false;
            }

            // 播放结束 → 自动随机下一首
            audio.addEventListener('ended', () => {
                // 只有当前是播放状态才继续随机（防止停止后触发）
                if (isPlaying) {
                    playRandom(false);
                }
            });

            // 监听音频错误
            audio.addEventListener('error', (e) => {
                console.error('音频加载错误:', e);
                setStatus('❌ 音频加载失败，请检查文件是否存在', true);
                updateUIForPlaying(false);
            });

            // 按钮事件
            playBtn.addEventListener('click', () => {
                isUserTriggered = true;
                playRandom(true);
            });

            stopBtn.addEventListener('click', stopAudio);

            // 页脚关于
            footerInfoLink.addEventListener('click', (e) => {
                e.preventDefault();
                alert('这是一个随机播放本地音乐的主页。\n请把音乐文件放在 music/ 文件夹，并在代码的 playlist 数组中添加文件名。');
            });

            // 页面加载时尝试自动播放（通常会被浏览器阻止）
            window.addEventListener('load', () => {
                if (playlist.length === 0) {
                    setStatus('⚠️ 请先在 playlist 数组中添加音乐文件', true);
                    return;
                }
                // 尝试自动播放随机一首
                playRandom(false);
            });
        })();
    </script>
</body>
</html>
