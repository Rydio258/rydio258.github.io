<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMAHA CT-X1 · 复古调谐器</title>
<script>
  (function() {
    var ua = navigator.userAgent || '';
    var isMobile = /Mobi|Android|iPhone|iPad|iPod|Windows Phone|webOS|BlackBerry/i.test(ua);
    var isNarrow = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
    var forceDesktop = /[?&]desktop=1/.test(location.search);
    if ((isMobile || isNarrow) && !forceDesktop) {
      location.replace('mobile.html' + location.hash);
    }
  })();
</script>
<style>
  @font-face {
    font-family: 'Zpix';
    src: url('Zpix.ttf') format('truetype');
    font-display: swap;
    font-weight: normal;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
    background-image: radial-gradient(ellipse at 50% 0%, #333 0%, #111 70%);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    padding: 2rem 1rem;
  }

  .tuner {
    width: 100%;
    max-width: 1180px;
    background: #d8d8d8;
    background-image: linear-gradient(180deg, #e8e8e8 0%, #d0d0d0 100%);
    border-radius: 4px;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.85),
      inset 0 1px 0 rgba(255,255,255,0.8),
      inset 0 -1px 0 rgba(0,0,0,0.2);
    padding: 28px 32px;
    position: relative;
  }

  .tuner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent, transparent 1px,
      rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px
    );
    border-radius: 4px;
    pointer-events: none;
  }

  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #b0b0b0;
  }

  .brand-left { display: flex; align-items: baseline; gap: 20px; }
  .brand-name { font-size: 1.75rem; font-weight: 700; letter-spacing: 3px; color: #111; }
  .brand-model { font-size: 0.75rem; letter-spacing: 2px; color: #555; text-transform: uppercase; }

  .brand-indicators { display: flex; gap: 24px; align-items: center; font-size: 0.7rem; letter-spacing: 1.5px; color: #555; font-weight: 600; }
  .indicator { display: flex; align-items: center; gap: 6px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: all 0.2s; }
  .led.on { background: #e33; box-shadow: 0 0 10px #e33, inset 0 0 2px rgba(255,255,255,0.6); }
  .led.green.on { background: #2a2; box-shadow: 0 0 10px #2a2, inset 0 0 2px rgba(255,255,255,0.6); }

  .dial-section {
    background: #f4f4f0;
    border: 1px solid #a0a0a0;
    border-radius: 3px;
    padding: 14px 20px;
    margin-bottom: 16px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
    position: relative;
  }

  .dial-display {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
  }

  .dial-frequency {
    font-family: 'Courier New', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: #111;
    letter-spacing: 2px;
    background: #e8e8e4;
    padding: 4px 18px;
    border-radius: 2px;
    border: 1px solid #b0b0b0;
    min-width: 170px;
    text-align: center;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    flex-shrink: 0;
  }

  .station-tag {
    font-family: 'Zpix', 'Courier New', monospace;
    font-size: 0.7rem;
    color: #111;
    background: #dedede;
    border: 1px solid #b0b0b0;
    border-radius: 2px;
    padding: 4px 12px;
    min-width: 100px;
    max-width: 180px;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    flex-shrink: 0;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
  }

  .track-display {
    flex: 1;
    max-width: 33.33%;
    height: 2.2rem;
    overflow: hidden;
    position: relative;
    background: #e8e8e4;
    border: 1px solid #b0b0b0;
    border-radius: 2px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-family: 'Zpix', 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 1px;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    margin-left: auto;
  }

  .track-display-inner {
    display: inline-block;
    white-space: nowrap;
    font-size: 0.75rem;
    color: #c0392b;
    letter-spacing: 1px;
    font-family: 'Zpix', 'Courier New', monospace;
    will-change: transform;
    line-height: 1;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
  }

  @keyframes marqueeMove {
    from { transform: translateX(var(--from-x)); }
    to   { transform: translateX(var(--to-x)); }
  }

  .dial-band-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: #666;
    letter-spacing: 1.5px;
    margin-bottom: 3px;
    font-weight: 600;
  }

  .fm-scale { position: relative; height: 38px; margin-bottom: 6px; background: #fafaf8; border-top: 1px solid #999; border-bottom: 1px solid #ccc; }
  .fm-ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 6px; }
  .fm-tick { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; }
  .fm-tick .line { width: 1px; height: 10px; background: #555; }
  .fm-tick.major .line { height: 18px; background: #111; width: 1.5px; }
  .fm-tick .num { font-size: 0.6rem; color: #333; margin-top: 3px; font-family: 'Courier New', monospace; font-weight: 600; }

  .am-scale { position: relative; height: 32px; background: #fafaf8; border-top: 1px solid #999; border-bottom: 1px solid #ccc; }
  .am-ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 6px; }
  .am-tick { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; }
  .am-tick .line { width: 1px; height: 8px; background: #555; }
  .am-tick.major .line { height: 15px; background: #111; width: 1.5px; }
  .am-tick .num { font-size: 0.55rem; color: #333; margin-top: 2px; font-family: 'Courier New', monospace; font-weight: 600; }

  .needle {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: #c0392b;
    box-shadow: 0 0 5px rgba(192,57,43,0.7);
    transition: left 0.05s linear;
    z-index: 5;
  }
  .needle::before {
    content: '';
    position: absolute;
    top: -2px; left: -4px;
    width: 10px; height: 10px;
    background: #c0392b;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  /* ============ info 面板 ============ */
  .work-info {
    display: none;
    background: linear-gradient(180deg, #f5edd4 0%, #ece0b8 100%);
    border: 1px solid #a89878;
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 18px;
    box-shadow: inset 0 1px 3px rgba(90, 70, 20, 0.15), 0 1px 2px rgba(0,0,0,0.1);
    font-family: 'Zpix', 'Courier New', monospace;
    font-size: 0.68rem;
    line-height: 1.7;
    color: #4a3a1a;
    max-height: 150px;
    overflow-y: auto;
    position: relative;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    animation: workInfoSlideIn 0.3s ease-out;
  }

  @keyframes workInfoSlideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .work-info::-webkit-scrollbar { width: 6px; }
  .work-info::-webkit-scrollbar-track { background: rgba(90, 70, 20, 0.08); border-radius: 3px; }
  .work-info::-webkit-scrollbar-thumb { background: #a89878; border-radius: 3px; }

  .work-info-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 5px;
    padding-bottom: 4px;
    border-bottom: 1px dashed #b8a888;
    gap: 12px;
  }

  .work-info-title {
    font-weight: 700;
    color: #8a2b1c;
    font-size: 0.72rem;
    letter-spacing: 1px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .work-info-tag {
    font-size: 0.5rem;
    letter-spacing: 1.5px;
    color: #a89878;
    flex-shrink: 0;
    font-weight: 700;
  }

  .work-info-desc { color: #4a3a1a; letter-spacing: 0.5px; }

  .work-info-desc .work-info-host {
    display: block;
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px dashed #b8a888;
    color: #6a4a1c;
    font-weight: 700;
    white-space: pre-wrap;
  }

  .work-info-desc .work-info-base {
    display: block;
    white-space: pre-wrap;
  }

  .work-info-desc .work-info-bg {
    display: block;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #b8a888;
    color: #6a4a1c;
    white-space: pre-wrap;
  }

  .work-info-desc .work-info-review {
    display: block;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #b8a888;
    color: #8a2b1c;
    white-space: pre-wrap;
  }

  .work-info-desc .work-info-now {
    display: block;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #b8a888;
    color: #8a2b1c;
    font-weight: 700;
    white-space: pre-wrap;
  }

  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    padding: 0 4px;
  }

  .left-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .control-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .control-label { font-size: 0.6rem; letter-spacing: 2px; color: #555; text-transform: uppercase; font-weight: 700; }

  .switch {
    width: 42px; height: 22px;
    background: #b0b0b0;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    border: 1px solid #888;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 1px; left: 1px;
    width: 18px; height: 18px;
    background: linear-gradient(180deg, #eee, #999);
    border-radius: 2px;
    transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .switch.on::after { transform: translateX(20px); background: linear-gradient(180deg, #fff, #bbb); }

  .small-knob {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0f0f0, #999 60%, #666);
    border: 2px solid #888;
    position: relative;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(0,0,0,0.3);
  }
  .small-knob::after {
    content: '';
    position: absolute;
    top: 4px; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 14px;
    background: #111;
    border-radius: 1px;
  }

  .transport-key {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .transport-key .key-body {
    width: 58px;
    height: 34px;
    background: linear-gradient(180deg, #e4e4e0 0%, #cfcfcb 45%, #b8b8b4 100%);
    border: 1px solid #8a8a86;
    border-radius: 2px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: #333;
    font-weight: 700;
    transition: all 0.06s;
    position: relative;
  }

  .transport-key .key-body::before {
    content: '';
    position: absolute;
    left: 5px; top: 50%;
    transform: translateY(-50%);
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #888;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.4);
    transition: all 0.2s;
  }

  .transport-key.play.active .key-body::before { background: #2ecc40; box-shadow: 0 0 6px #2ecc40; }
  .transport-key.stop.active .key-body::before { background: #e33; box-shadow: 0 0 6px #e33; }
  .transport-key.prev.active .key-body::before,
  .transport-key.next.active .key-body::before { background: #ffb347; box-shadow: 0 0 6px #ffb347; }

  .transport-key:active .key-body,
  .transport-key.pressed .key-body {
    background: linear-gradient(180deg, #b8b8b4 0%, #c4c4c0 50%, #d4d4d0 100%);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.35);
    transform: translateY(1px);
  }

  .transport-key .key-label {
    font-size: 0.5rem;
    letter-spacing: 2px;
    color: #666;
    font-weight: 700;
  }

  .meters-group { display: flex; gap: 16px; flex: 1; justify-content: center; }

  .meter {
    width: 200px;
    position: relative;
    background: linear-gradient(180deg, #fff5d6 0%, #f7ecc8 45%, #e8dcb0 100%);
    border: 1px solid #8a8a86;
    border-radius: 3px;
    padding: 5px 8px 3px;
    box-shadow:
      inset 0 2px 6px rgba(90, 70, 20, 0.25),
      inset 0 -1px 2px rgba(255, 240, 200, 0.5),
      0 0 22px rgba(255, 220, 120, 0.25),
      0 2px 4px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .meter::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% -20%, rgba(255, 248, 200, 0.95) 0%, rgba(255, 235, 160, 0.35) 40%, transparent 75%);
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
    animation: lampFlicker 4s ease-in-out infinite;
  }

  @keyframes lampFlicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.92; }
  }

  .meter-lamp {
    position: absolute;
    top: -1px; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 3px;
    background: linear-gradient(90deg, transparent, #ffeb99, #fff8cc, #ffeb99, transparent);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255, 220, 120, 0.9);
    z-index: 3;
    pointer-events: none;
    animation: lampFlicker 4s ease-in-out infinite;
  }

  .meter-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: #5a4a20;
    text-align: center;
    margin-bottom: 1px;
    font-weight: 700;
    position: relative;
    z-index: 3;
    text-shadow: 0 0 4px rgba(255, 240, 180, 0.8);
  }

  .meter-svg { display: block; width: 100%; height: auto; position: relative; z-index: 1; }

  .big-knob-container { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
  .big-knob {
    width: 112px; height: 112px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f5f5f5, #b0b0b0 50%, #777 90%);
    border: 2px solid #999;
    position: relative;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 -5px 10px rgba(0,0,0,0.3), inset 0 5px 10px rgba(255,255,255,0.6);
    transition: box-shadow 0.2s;
  }
  .big-knob:hover {
    box-shadow: 0 12px 24px rgba(0,0,0,0.6), 0 0 0 3px rgba(192,57,43,0.15), inset 0 -5px 10px rgba(0,0,0,0.3), inset 0 5px 10px rgba(255,255,255,0.6);
  }
  .big-knob::after {
    content: '';
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 30px;
    background: #111;
    border-radius: 2px;
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }
  .big-knob::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, transparent 0deg 4deg, rgba(0,0,0,0.08) 4deg 6deg);
    pointer-events: none;
  }

  .knob-hint {
    font-size: 0.55rem;
    color: #777;
    letter-spacing: 1.5px;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
  }
  .knob-hint strong { color: #c0392b; display: block; font-size: 0.6rem; }

  .status-bar {
    margin-top: 14px;
    padding: 6px 14px;
    background: #1a1614;
    color: #ffb347;
    font-family: 'Zpix', 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    border-radius: 3px;
    border: 1px solid #0a0806;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
  }

  .status-bar .status-text { color: #ffb347; flex: 1; min-width: 0; word-break: break-all; }
  .status-bar .status-time { color: #a5f3fc; font-size: 0.68rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .status-bar .status-count { color: #8a8078; flex-shrink: 0; }

  footer {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 1180px;
    padding: 0 8px;
    font-size: 0.7rem;
    color: #666;
    letter-spacing: 1.5px;
    flex-wrap: wrap;
    gap: 10px;
  }
  footer a { color: #888; text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: #c0392b; }
  .footer-links { display: flex; gap: 22px; align-items: center; }

  .feedback-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    background: linear-gradient(180deg, #e4e4e0 0%, #cfcfcb 45%, #b8b8b4 100%);
    border: 1px solid #8a8a86;
    border-radius: 2px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
    font-size: 0.7rem;
    letter-spacing: 1px;
    color: #333;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .feedback-btn:hover { background: linear-gradient(180deg, #f0f0ec 0%, #dbdbd7 45%, #c4c4c0 100%); color: #111; }
  .feedback-btn:active { transform: translateY(1px); }
  .feedback-btn .btn-icon { font-size: 0.85rem; line-height: 1; }

  @media (max-width: 1080px) {
    .tuner { padding: 20px; }
    .brand-name { font-size: 1.3rem; }
    .brand-model { display: none; }
    .control-row { flex-wrap: wrap; gap: 14px; }
    .left-controls { width: 100%; justify-content: space-around; }
    .meters-group { order: -1; width: 100%; justify-content: space-around; }
    .meter { width: 46%; }
    .big-knob { width: 90px; height: 90px; }
    .big-knob::after { height: 24px; }
    .track-display { max-width: 160px; }
    .track-display-inner { font-size: 0.65rem; }
    .station-tag { display: none; }
    .work-info { max-height: 120px; font-size: 0.62rem; }
  }
</style>
</head>
<body>

<div class="tuner">
  <div class="brand-row">
    <div class="brand-left">
      <div class="brand-name">YAMAHA</div>
      <div class="brand-model">Natural Sound AM/FM Stereo Tuner · CT-X1</div>
    </div>
    <div class="brand-indicators">
      <div class="indicator">
        <span class="led green" id="ledStereo"></span> FM STEREO
      </div>
      <div class="indicator">
        <span class="led" id="ledPower"></span> POWER
      </div>
    </div>
  </div>

  <div class="dial-section">
    <div class="dial-display">
      <div class="dial-frequency" id="freqDisplay">--.- MHz</div>
      <div class="station-tag" id="stationTag">—</div>
      <div class="track-display" id="trackDisplay">
        <div class="track-display-inner" id="trackDisplayInner">未播放</div>
      </div>
    </div>

    <div class="dial-band-labels">
      <span>FM</span>
      <span>MHz</span>
    </div>
    <div class="fm-scale" id="fmScale">
      <div class="fm-ticks" id="fmTicks"></div>
      <div class="needle" id="needle"></div>
    </div>

    <div class="dial-band-labels" style="margin-top:6px;">
      <span>AM</span>
      <span>kHz</span>
    </div>
    <div class="am-scale" id="amScale">
      <div class="am-ticks" id="amTicks"></div>
    </div>
  </div>

  <div class="work-info" id="workInfo">
    <div class="work-info-header">

<script src="playlist.js"></script>

<script>
(function() {
  const config = window.PLAYLIST || { stations: [] };
  const stations = Array.isArray(config.stations) ? config.stations : [];

  const FM_MIN = 76.0, FM_MAX = 108.0;
  const AM_MIN = 520, AM_MAX = 1600;

  const audio = document.getElementById('bgMusic');
  const freqDisplay = document.getElementById('freqDisplay');
  const stationTag = document.getElementById('stationTag');
  const trackDisplay = document.getElementById('trackDisplay');
  const trackDisplayInner = document.getElementById('trackDisplayInner');
  const needle = document.getElementById('needle');
  const powerSwitch = document.getElementById('powerSwitch');
  const ledPower = document.getElementById('ledPower');
  const ledStereo = document.getElementById('ledStereo');
  const volumeKnob = document.getElementById('volumeKnob');
  const tuningKnob = document.getElementById('tuningKnob');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const statusText = document.getElementById('statusText');
  const statusTime = document.getElementById('statusTime');
  const statusCount = document.getElementById('statusCount');
  const footerInfoLink = document.getElementById('footerInfoLink');
  const workInfo = document.getElementById('workInfo');
  const workInfoTitle = document.getElementById('workInfoTitle');
  const workInfoDesc = document.getElementById('workInfoDesc');

  let isPowered = false;
  let currentPos = 20;
  let lockedStation = null;
  let isPlaying = false;
  let currentEntryIndex = 0;
  let currentMovementIndex = 0;
  let audioContext = null;
  let analyser = null;
  let timeDataArray = null;
  let freqDataArray = null;
  let vuNeedle, tuningNeedle;
  let volumeLevel = 0.7;

  let vuCurrentAngle = -65, vuTargetAngle = -65;
  let tunCurrentAngle = -65, tunTargetAngle = -65;

  function setStatus(text) { statusText.textContent = text; }

  // ============ 工具函数 ============
  function isWork(item) { return item && typeof item === 'object' && Array.isArray(item.movements); }
  function getMovements(item) { return isWork(item) ? item.movements : [item]; }

  function getFileName(path) {
    if (!path) return '';
    const decoded = decodeURIComponent(path);
    const filename = decoded.split('/').pop() || '';
    return filename.replace(/\.[^/.]+$/, '');
  }

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return '--:--';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  // ============ 虚拟电台时钟 ============
  const SLOT_SONG = 240;
  const SLOT_WORK = 480;
  function estimateDuration(item) { return isWork(item) ? SLOT_WORK : SLOT_SONG; }

  function getVirtualPlayhead(station) {
    const songs = station.songs;
    if (!songs || songs.length === 0) return { index: 0, movementIndex: 0, offset: 0 };
    const durations = songs.map(estimateDuration);
    const totalCycle = durations.reduce((a, b) => a + b, 0);
    if (totalCycle === 0) return { index: 0, movementIndex: 0, offset: 0 };
    const elapsed = Math.floor(Date.now() / 1000) % totalCycle;
    let acc = 0;
    for (let i = 0; i < songs.length; i++) {
      if (elapsed < acc + durations[i]) {
        const inItem = elapsed - acc;
        const item = songs[i];
        if (isWork(item)) {
          const moveCount = Math.max(1, item.movements.length);
          const moveDur = durations[i] / moveCount;
          let mi = Math.floor(inItem / moveDur);
          if (mi >= item.movements.length) mi = item.movements.length - 1;
          return { index: i, movementIndex: mi, offset: inItem - mi * moveDur };
        }
        return { index: i, movementIndex: 0, offset: inItem };
      }
      acc += durations[i];
    }
    return { index: 0, movementIndex: 0, offset: 0 };
  }

  // ============ info.txt 加载 ============
  const infoCache = new Map();

  function parseTimelineSection(section) {
    const notes = [];
    for (const rawLine of section.split('\n')) {
      const line = rawLine.trim();
      if (!line) continue;
      const m = line.match(/^\[?(\d+:\d{2}(?::\d{2})?)\]?\s+(.+)$/);
      if (m) {
        const parts = m[1].split(':').map(Number);
        const sec = parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + parts[1];
        notes.push({ time: sec, text: m[2].trim() });
      }
    }
    notes.sort((a, b) => a.time - b.time);
    return notes;
  }

  function parseTagSection(section) {
    const tags = {};
    for (const rawLine of section.split('\n')) {
      const line = rawLine.trim();
      if (!line) continue;
      const m = line.match(/^\[([^\]]+)\]\s*(.+)$/);
      if (m) tags[m[1].trim().toLowerCase()] = m[2].trim();
    }
    return tags;
  }

  function parseInfoTxt(content) {
    const sections = content.split(/\n\s*[-=]{3,}\s*\n/).map(s => s.trim()).filter(Boolean);
    if (sections.length === 0) return null;
    const description = sections[0];
    const timeline = [];
    const tags = {};

    for (let i = 1; i < sections.length; i++) {
      const section = sections[i];
      const firstLine = section.split('\n')[0].trim();
      if (/^\[?\d+:\d{2}/.test(firstLine)) {
        timeline.push(parseTimelineSection(section));
      } else if (/^\[[^\]]+\]/.test(firstLine)) {
        Object.assign(tags, parseTagSection(section));
      }
    }
    return { description, sections, timeline, tags };
  }

  async function loadInfo(path) {
    if (infoCache.has(path)) return infoCache.get(path);
    try {
      const resp = await fetch(path, { cache: 'force-cache' });
      if (!resp.ok) { infoCache.set(path, null); return null; }
      const text = await resp.text();
      const parsed = parseInfoTxt(text);
      infoCache.set(path, parsed);
      return parsed;
    } catch (err) {
      infoCache.set(path, null);
      return null;
    }
  }

  function getStationInfoPath(station) {
    if (!station || !station.songs || station.songs.length === 0) return null;
    const first = station.songs[0];
    const firstFile = isWork(first) ? first.movements[0] : first;
    const parts = firstFile.split('/');
    parts.pop();
    return parts.join('/') + '/info.txt';
  }

  function getWorkInfoPath(item) {
    if (!isWork(item) || item.movements.length === 0) return null;
    const first = item.movements[0];
    const lastSlash = first.lastIndexOf('/');
    if (lastSlash < 0) return null;
    return first.substring(0, lastSlash) + '/info.txt';
  }

  // 从 mp3 路径推导单曲 info 路径
  function getSongInfoPath(file) {
    if (!file) return null;
    // music/C-POP/djt.mp3 → music/C-POP/djt.info.txt
    return file.replace(/\.[^/.]+$/, '') + '.info.txt';
  }

  // ============ 主持人文字 ============
  function getTimeSlot(date) {
    const h = date.getHours();
    if (h >= 5 && h < 11) return 'morning';
    if (h >= 11 && h < 14) return 'noon';
    if (h >= 14 && h < 18) return 'afternoon';
    if (h >= 18 && h < 22) return 'evening';
    return 'night';
  }

  function fillPlaceholders(text, item, file) {
    const songName = getFileName(file);
    const workName = item && isWork(item) ? item.work : '';
    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    return text
      .replace(/\{song\}/g, songName)
      .replace(/\{work\}/g, workName)
      .replace(/\{time\}/g, timeStr);
  }

  function pickHostMessage(tags, item, file) {
    if (!tags) return null;
    const fileName = getFileName(file);
    const songKey = ('song:' + fileName).toLowerCase();
    if (tags[songKey]) return fillPlaceholders(tags[songKey], item, file);
    const timeKey = getTimeSlot(new Date());
    if (tags[timeKey]) return fillPlaceholders(tags[timeKey], item, file);
    const day = new Date().getDay();
    if ((day === 0 || day === 6) && tags['weekend']) return fillPlaceholders(tags['weekend'], item, file);
    if (day >= 1 && day <= 5 && tags['weekday']) return fillPlaceholders(tags['weekday'], item, file);
    if (tags['default']) return fillPlaceholders(tags['default'], item, file);
    return null;
  }

  // ============ 渲染 info 面板 ============
  let lastRenderedInfo = '';

  async function renderInfo(item, movementIndex, currentTime, file) {
    if (!lockedStation) {
      workInfo.style.display = 'none';
      lastRenderedInfo = '';
      return;
    }

    const stationPath = getStationInfoPath(lockedStation);
    const workPath = isWork(item) ? getWorkInfoPath(item) : null;
    const songPath = (!isWork(item) && file) ? getSongInfoPath(file) : null;

    const [stationInfo, workData, songData] = await Promise.all([
      stationPath ? loadInfo(stationPath) : Promise.resolve(null),
      workPath ? loadInfo(workPath) : Promise.resolve(null),
      songPath ? loadInfo(songPath) : Promise.resolve(null)
    ]);

    if (!stationInfo && !workData && !songData) {
      workInfo.style.display = 'none';
      lastRenderedInfo = '';
      return;
    }

    // 标题
    let title = '';
    if (item && isWork(item)) title = item.work;
    else if (file) title = getFileName(file);
    else title = lockedStation.name;

    // 主持人文字
    let hostMessage = stationInfo && stationInfo.tags
      ? pickHostMessage(stationInfo.tags, item, file)
      : null;

    // 描述与正文
    let description = '';
    let songBg = '';
    let songReview = '';

    if (workData && workData.description) {
      // 古典作品：描述 + 时间轴
      description = workData.description;
    } else if (songData) {
      // 单曲：三段式
      const secs = songData.sections || [];
      description = secs[0] || '';
      songBg = secs[1] || '';
      songReview = secs[2] || '';
    } else if (stationInfo && stationInfo.description) {
      // 只命中电台级
      description = stationInfo.description;
    }

    // 时间轴（古典作品）
    let nowNote = null;
    if (workData && workData.timeline && workData.timeline[movementIndex]) {
      for (const n of workData.timeline[movementIndex]) {
        if (currentTime >= n.time) nowNote = n;
        else break;
      }
    }

    // 拼 HTML
    let html = '';
    if (hostMessage) {
      html += '<span class="work-info-host">▸ ' + escapeHtml(hostMessage) + '</span>';
    }
    if (description) {
      html += '<span class="work-info-base">' + escapeHtml(description) + '</span>';
    }
    if (songBg) {
      html += '<span class="work-info-bg">▸ ' + escapeHtml(songBg) + '</span>';
    }
    if (songReview) {
      html += '<span class="work-info-review">♪ ' + escapeHtml(songReview) + '</span>';
    }
    if (nowNote) {
      html += '<span class="work-info-now">♪ ' + escapeHtml(nowNote.text) + '</span>';
    }

    if (html === lastRenderedInfo) return;
    lastRenderedInfo = html;

    workInfoTitle.textContent = title;
    workInfoDesc.innerHTML = html;
    workInfo.style.display = 'block';
  }

  function hideWorkInfo() {
    workInfo.style.display = 'none';
    lastRenderedInfo = '';
  }

  // ============ 表头 ============
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 80, CY = 42;
  const START_DEG = -155, END_DEG = -25;
  const R_ARC = 30, R_TICK_IN = 25, R_TICK_OUT = 30, NEEDLE_LEN = 32;
  const VU_MARKS = [
    { t: 0.00, major: true }, { t: 0.05, major: false }, { t: 0.10, major: false },
    { t: 0.16, major: true }, { t: 0.22, major: false }, { t: 0.28, major: true },
    { t: 0.33, major: false }, { t: 0.38, major: true }, { t: 0.44, major: false },
    { t: 0.50, major: true }, { t: 0.57, major: true }, { t: 0.64, major: true },
    { t: 0.72, major: true }, { t: 0.80, major: true }, { t: 0.87, major: true },
    { t: 0.94, major: true }
  ];

  function polar(deg, r) {
    const rad = deg * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }

  function buildVUMeter(svg, gradientId, color) {
    const defs = document.createElementNS(SVG_NS, 'defs');
    const radial = document.createElementNS(SVG_NS, 'radialGradient');
    radial.setAttribute('id', gradientId);
    radial.setAttribute('cx', '50%'); radial.setAttribute('cy', '0%'); radial.setAttribute('r', '110%');
    ['#fffbe8', '#fdf4d0', '#ecdfb0'].forEach((c, i) => {
      const s = document.createElementNS(SVG_NS, 'stop');
      s.setAttribute('offset', (i * 50) + '%');
      s.setAttribute('stop-color', c);
      radial.appendChild(s);
    });
    defs.appendChild(radial);
    svg.appendChild(defs);

    const bg = document.createElementNS(SVG_NS, 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', 160); bg.setAttribute('height', 45);
    bg.setAttribute('rx', 2);
    bg.setAttribute('fill', `url(#${gradientId})`);
    svg.appendChild(bg);

    const [ax1, ay1] = polar(START_DEG, R_ARC);
    const [ax2, ay2] = polar(END_DEG, R_ARC);
    const arc = document.createElementNS(SVG_NS, 'path');
    arc.setAttribute('d', `M ${ax1} ${ay1} A ${R_ARC} ${R_ARC} 0 0 1 ${ax2} ${ay2}`);
    arc.setAttribute('fill', 'none');
    arc.setAttribute('stroke', '#4a3a1a');
    arc.setAttribute('stroke-width', '1.2');
    svg.appendChild(arc);

    VU_MARKS.forEach(mark => {
      const angle = START_DEG + (END_DEG - START_DEG) * mark.t;
      const rIn = mark.major ? R_TICK_IN - 3 : R_TICK_IN;
      const p1 = polar(angle, rIn);
      const p2 = polar(angle, R_TICK_OUT);
      const tick = document.createElementNS(SVG_NS, 'line');
      tick.setAttribute('x1', p1[0]); tick.setAttribute('y1', p1[1]);
      tick.setAttribute('x2', p2[0]); tick.setAttribute('y2', p2[1]);
      tick.setAttribute('stroke', '#4a3a1a');
      tick.setAttribute('stroke-width', mark.major ? '1.3' : '0.6');
      svg.appendChild(tick);
    });

    const degRedStart = START_DEG + (END_DEG - START_DEG) * 0.72;
    const rp1 = polar(degRedStart, R_ARC);
    const rp2 = polar(END_DEG, R_ARC);
    const redArc = document.createElementNS(SVG_NS, 'path');
    redArc.setAttribute('d', `M ${rp1[0]} ${rp1[1]} A ${R_ARC} ${R_ARC} 0 0 1 ${rp2[0]} ${rp2[1]}`);
    redArc.setAttribute('fill', 'none');
    redArc.setAttribute('stroke', '#c0392b');
    redArc.setAttribute('stroke-width', '2.5');
    redArc.setAttribute('stroke-linecap', 'round');
    svg.appendChild(redArc);

    const needleEl = document.createElementNS(SVG_NS, 'line');
    needleEl.setAttribute('x1', CX); needleEl.setAttribute('y1', CY);
    needleEl.setAttribute('x2', CX); needleEl.setAttribute('y2', CY - NEEDLE_LEN);
    needleEl.setAttribute('stroke', color);
    needleEl.setAttribute('stroke-width', '1.6');
    needleEl.setAttribute('stroke-linecap', 'round');
    needleEl.setAttribute('transform', `rotate(-65 ${CX} ${CY})`);
    svg.appendChild(needleEl);

    const pivot = document.createElementNS(SVG_NS, 'circle');
    pivot.setAttribute('cx', CX); pivot.setAttribute('cy', CY);
    pivot.setAttribute('r', 3);
    pivot.setAttribute('fill', '#2a1a0a');
    svg.appendChild(pivot);
    return needleEl;
  }

  vuNeedle = buildVUMeter(document.getElementById('vuMeter'), 'vuGlow', '#1a1a1a');
  tuningNeedle = buildVUMeter(document.getElementById('tuningMeter'), 'tuningGlow', '#c0392b');

  function buildFMScale() {
    const container = document.getElementById('fmTicks');
    for (let i = 0; i <= 32; i++) {
      const freq = FM_MIN + i;
      const tick = document.createElement('div');
      tick.className = 'fm-tick' + (i % 5 === 0 ? ' major' : '');
      const line = document.createElement('div');
      line.className = 'line';
      tick.appendChild(line);
      if (i % 2 === 0) {
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = freq;
        tick.appendChild(num);
      }
      container.appendChild(tick);
    }
  }

  function buildAMScale() {
    const container = document.getElementById('amTicks');
    for (let i = 0; i <= 10; i++) {
      const freq = AM_MIN + i * (AM_MAX - AM_MIN) / 10;
      const tick = document.createElement('div');
      tick.className = 'am-tick major';
      const line = document.createElement('div');
      line.className = 'line';
      tick.appendChild(line);
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = Math.round(freq);
      tick.appendChild(num);
      container.appendChild(tick);
    }
  }

  buildFMScale();
  buildAMScale();

  // ============ 音频分析 ============
  function initAudioContext() {
    if (audioContext) {
      if (audioContext.state === 'suspended') audioContext.resume();
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioContext = new AC();
      const source = audioContext.createMediaElementSource(audio);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.3;
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      timeDataArray = new Uint8Array(analyser.fftSize);
      freqDataArray = new Uint8Array(analyser.frequencyBinCount);
      requestAnimationFrame(animateMeters);
    } catch (err) {
      console.warn('AudioContext 初始化失败:', err);
    }
  }

  function animateMeters() {
    if (!analyser || !timeDataArray || !freqDataArray) {
      requestAnimationFrame(animateMeters);
      return;
    }
    analyser.getByteTimeDomainData(timeDataArray);
    let sum = 0;
    for (let i = 0; i < timeDataArray.length; i++) {
      const v = (timeDataArray[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / timeDataArray.length);
    const db = 20 * Math.log10(rms + 0.0001);
    let vuT = Math.max(0, Math.min(1, (db + 40) / 43));
    vuTargetAngle = -65 + vuT * 130;
    vuCurrentAngle += (vuTargetAngle - vuCurrentAngle) * 0.18;
    vuNeedle.setAttribute('transform', `rotate(${vuCurrentAngle} ${CX} ${CY})`);

    analyser.getByteFrequencyData(freqDataArray);
    const binStart = Math.floor(freqDataArray.length * 0.08);
    const binEnd = Math.floor(freqDataArray.length * 0.55);
    let bandSum = 0;
    for (let i = binStart; i < binEnd; i++) bandSum += freqDataArray[i];
    const bandAvg = bandSum / (binEnd - binStart);
    let tunT = Math.max(0, Math.min(1, bandAvg / 130));
    const jitter = (Math.random() - 0.5) * 0.05;
    tunTargetAngle = Math.max(-65, Math.min(65, -65 + (tunT + jitter) * 130));
    tunCurrentAngle += (tunTargetAngle - tunCurrentAngle) * 0.55;
    tuningNeedle.setAttribute('transform', `rotate(${tunCurrentAngle} ${CX} ${CY})`);

    requestAnimationFrame(animateMeters);
  }

  // ============ 滚动显示 ============
  function updateTrackDisplay(text) {
    trackDisplayInner.textContent = text;
    trackDisplayInner.style.animation = 'none';
    trackDisplayInner.style.transform = 'translateX(0)';
    void trackDisplayInner.offsetWidth;
    const tunerEl = document.querySelector('.tuner');
    const panelWidth = tunerEl.clientWidth - 72;
    const threshold = panelWidth / 3;
    const cw = trackDisplay.clientWidth - 24;
    const tw = trackDisplayInner.scrollWidth;
    if (tw > threshold) {
      const totalDist = cw + tw;
      const dur = Math.max(totalDist / 60, 4);
      trackDisplayInner.style.setProperty('--from-x', cw + 'px');
      trackDisplayInner.style.setProperty('--to-x', -tw + 'px');
      trackDisplayInner.style.setProperty('--dur', dur + 's');
      trackDisplayInner.style.animation = 'marqueeMove var(--dur) linear infinite';
    }
  }

  // ============ 调谐 ============
  function posToFreq(pos) { return FM_MIN + (pos / 100) * (FM_MAX - FM_MIN); }
  function formatFreq(pos) { return posToFreq(pos).toFixed(1) + ' MHz'; }

  function updateTuning(pos) {
    if (pos < 0) pos = 0;
    if (pos > 100) pos = 100;
    currentPos = pos;
    freqDisplay.textContent = formatFreq(pos);
    needle.style.left = pos + '%';

    let found = null;
    for (const st of stations) {
      if (Math.abs(pos - st.pos) < 1.2) { found = st; break; }
    }

    if (found) {
      ledStereo.classList.add('on');
      stationTag.textContent = found.name || '—';
      if (found !== lockedStation) {
        lockedStation = found;
        if (isPowered) playStationVirtual(found);
        else setStatus('已锁定电台：' + found.name + '（电源未开）');
      }
    } else {
      lockedStation = null;
      ledStereo.classList.remove('on');
      stationTag.textContent = '—';
      if (isPowered && isPlaying) { audio.pause(); isPlaying = false; }
      hideWorkInfo();
    }
  }

  // ============ 播放 ============
  function playStationVirtual(station) {
    if (!station || !station.songs || station.songs.length === 0) {
      setStatus('该电台没有歌曲');
      hideWorkInfo();
      return;
    }
    const pos = getVirtualPlayhead(station);
    currentEntryIndex = pos.index;
    currentMovementIndex = pos.movementIndex;
    const item = station.songs[pos.index];
    const movements = getMovements(item);
    playSong(movements[pos.movementIndex], item, pos.movementIndex, pos.offset);
  }

  function playSong(file, item, movementIndex, startOffset) {
    initAudioContext();
    startOffset = startOffset || 0;

    const displayName = (item && isWork(item))
      ? item.work + ' - ' + getFileName(file)
      : getFileName(file);

    setStatus('正在播放：' + displayName);
    audio.src = file;
    audio.volume = volumeLevel;

    const onLoaded = () => {
      audio.removeEventListener('loadedmetadata', onLoaded);
      if (startOffset > 0) {
        const maxOff = Math.max(0, (audio.duration || 300) - 3);
        audio.currentTime = Math.min(startOffset, maxOff);
      }
      audio.play().then(() => {
        isPlaying = true;
        updateTrackDisplay(displayName);
        playBtn.classList.add('active');
        stopBtn.classList.remove('active');
        renderInfo(item, movementIndex, audio.currentTime || 0, file);
      }).catch(err => {
        isPlaying = false;
        setStatus('播放失败：' + (err.message || err.name));
        updateTrackDisplay('播放失败');
      });
    };
    audio.addEventListener('loadedmetadata', onLoaded);
  }

  function nextSong() {
    if (!lockedStation || !lockedStation.songs || lockedStation.songs.length === 0) {
      setStatus('请先选择一个电台');
      return;
    }
    const item = lockedStation.songs[currentEntryIndex];
    const movements = getMovements(item);

    if (currentMovementIndex < movements.length - 1) {
      currentMovementIndex++;
      playSong(movements[currentMovementIndex], item, currentMovementIndex, 0);
      return;
    }

    if (isWork(item)) {
      currentEntryIndex = (currentEntryIndex + 1) % lockedStation.songs.length;
    } else {
      currentEntryIndex = Math.floor(Math.random() * lockedStation.songs.length);
    }
    currentMovementIndex = 0;
    const nextItem = lockedStation.songs[currentEntryIndex];
    playSong(getMovements(nextItem)[0], nextItem, 0, 0);
  }

  function prevSong() {
    if (!lockedStation || !lockedStation.songs || lockedStation.songs.length === 0) {
      setStatus('请先选择一个电台');
      return;
    }
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      setStatus('回到开头');
      return;
    }
    const item = lockedStation.songs[currentEntryIndex];
    const movements = getMovements(item);

    if (currentMovementIndex > 0) {
      currentMovementIndex--;
      playSong(movements[currentMovementIndex], item, currentMovementIndex, 0);
      return;
    }

    if (isWork(item)) {
      currentEntryIndex = (currentEntryIndex - 1 + lockedStation.songs.length) % lockedStation.songs.length;
    } else {
      currentEntryIndex = Math.floor(Math.random() * lockedStation.songs.length);
    }
    const prevItem = lockedStation.songs[currentEntryIndex];
    const prevMovements = getMovements(prevItem);
    currentMovementIndex = prevMovements.length - 1;
    playSong(prevMovements[currentMovementIndex], prevItem, currentMovementIndex, 0);
  }

  function tuneToStation(station) {
    needle.style.transition = 'left 0.9s cubic-bezier(0.4, 0, 0.2, 1)';
    updateTuning(station.pos);
    setTimeout(() => { needle.style.transition = 'left 0.05s linear'; }, 950);
  }

  function handlePlay() {
    if (stations.length === 0) { setStatus('歌单为空'); return; }
    if (!isPowered) {
      isPowered = true;
      powerSwitch.classList.add('on');
      ledPower.classList.add('on');
    }
    if (lockedStation) playStationVirtual(lockedStation);
    else {
      const randomStation = stations[Math.floor(Math.random() * stations.length)];
      tuneToStation(randomStation);
    }
  }

  function handleStop() {
    audio.pause();
    audio.currentTime = 0;
    isPlaying = false;
    playBtn.classList.remove('active');
    stopBtn.classList.add('active');
    setTimeout(() => stopBtn.classList.remove('active'), 200);
    vuTargetAngle = -65; tunTargetAngle = -65;
    statusTime.textContent = '--:-- / --:--';
    setStatus('已停止');
    updateTrackDisplay('已停止');
    hideWorkInfo();
  }

  playBtn.addEventListener('click', handlePlay);
  stopBtn.addEventListener('click', handleStop);
  prevBtn.addEventListener('click', () => { prevBtn.classList.add('active'); setTimeout(() => prevBtn.classList.remove('active'), 200); prevSong(); });
  nextBtn.addEventListener('click', () => { nextBtn.classList.add('active'); setTimeout(() => nextBtn.classList.remove('active'), 200); nextSong(); });

  powerSwitch.addEventListener('click', () => {
    isPowered = !isPowered;
    powerSwitch.classList.toggle('on', isPowered);
    ledPower.classList.toggle('on', isPowered);
    if (isPowered) { setStatus('电源已开'); updateTuning(currentPos); }
    else {
      audio.pause(); isPlaying = false;
      ledStereo.classList.remove('on');
      stationTag.textContent = '—';
      setStatus('电源已关');
      updateTrackDisplay('关机');
      statusTime.textContent = '--:-- / --:--';
      playBtn.classList.remove('active');
      vuTargetAngle = -65; tunTargetAngle = -65;
      hideWorkInfo();
    }
  });

  volumeKnob.addEventListener('click', () => {
    volumeLevel = volumeLevel >= 0.9 ? 0.2 : volumeLevel + 0.25;
    audio.volume = volumeLevel;
    setStatus('音量：' + Math.round(volumeLevel * 100) + '%');
  });

  // ============ 大旋钮 ============
  let isDragging = false, startY = 0, startPos = 0, totalMovement = 0, lastY = 0;

  tuningKnob.addEventListener('mousedown', (e) => {
    isDragging = true; startY = e.clientY; lastY = e.clientY;
    totalMovement = 0; startPos = currentPos; e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    totalMovement += Math.abs(e.clientY - lastY);
    lastY = e.clientY;
    updateTuning(startPos + (startY - e.clientY) * 0.15);
  });
  document.addEventListener('mouseup', () => {
    if (isDragging && totalMovement < 6) {
      if (stations.length === 0) { setStatus('歌单为空'); }
      else {
        if (!isPowered) { isPowered = true; powerSwitch.classList.add('on'); ledPower.classList.add('on'); }
        const randomStation = stations[Math.floor(Math.random() * stations.length)];
        tuneToStation(randomStation);
      }
    }
    isDragging = false;
  });

  tuningKnob.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!isPowered) { isPowered = true; powerSwitch.classList.add('on'); ledPower.classList.add('on'); }
    updateTuning(currentPos + (e.deltaY > 0 ? -0.5 : 0.5));
  }, { passive: false });

  tuningKnob.addEventListener('touchstart', (e) => {
    isDragging = true; startY = e.touches[0].clientY; lastY = e.touches[0].clientY;
    totalMovement = 0; startPos = currentPos;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    totalMovement += Math.abs(e.touches[0].clientY - lastY);
    lastY = e.touches[0].clientY;
    updateTuning(startPos + (startY - e.touches[0].clientY) * 0.15);
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (isDragging && totalMovement < 8) {
      if (stations.length === 0) return;
      if (!isPowered) { isPowered = true; powerSwitch.classList.add('on'); ledPower.classList.add('on'); }
      const randomStation = stations[Math.floor(Math.random() * stations.length)];
      tuneToStation(randomStation);
    }
    isDragging = false;
  });

  audio.addEventListener('ended', () => { if (isPowered && lockedStation) nextSong(); });
  audio.addEventListener('error', () => {
    setStatus('音频加载失败：' + getFileName(audio.src));
    updateTrackDisplay('加载失败');
  });

  audio.addEventListener('timeupdate', () => {
    const cur = audio.currentTime || 0;
    const dur = audio.duration || 0;
    statusTime.textContent = formatTime(cur) + ' / ' + formatTime(dur);
    if (lockedStation && currentEntryIndex >= 0) {
      const item = lockedStation.songs[currentEntryIndex];
      if (item) {
        const file = getMovements(item)[currentMovementIndex];
        renderInfo(item, currentMovementIndex, cur, file);
      }
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    statusTime.textContent = '0:00 / ' + formatTime(audio.duration);
  });

  footerInfoLink.addEventListener('click', (e) => {
    e.preventDefault();
    alert('YAMAHA CT-X1 复古调谐器\n\n· 时间自动流动，像真电台一样\n· 每个电台和作品文件夹可放 info.txt\n· 单曲支持 <歌名>.info.txt，三段式展示简介/背景/点评\n· 主持人台词支持 [morning]、[night] 等时间标签');
  });

  if (stations.length === 0) {
    setStatus('未检测到歌单');
    updateTrackDisplay('歌单未加载');
    statusCount.textContent = '歌单: 0';
  } else {
    const totalSongs = stations.reduce((sum, st) => sum + (st.songs ? st.songs.length : 0), 0);
    statusCount.textContent = `歌单: ${stations.length}台 / ${totalSongs}条目`;
    setStatus('就绪，点击 PLAY 调进电台');
    updateTuning(stations[0].pos);
  }
  audio.volume = volumeLevel;
})();
</script>

</body>
