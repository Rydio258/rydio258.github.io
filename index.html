<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 Apple Music 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 1.5rem;
            padding-bottom: 0;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #a5f3fc, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .subhead {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #334155;
            padding-bottom: 1rem;
            width: 100%;
        }

        .music-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.6);
            width: 100%;
            transition: transform 0.2s;
        }

        .now-playing {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0b1120;
            padding: 0.9rem 1.5rem;
            border-radius: 3rem;
            margin-bottom: 2rem;
            border: 1px solid #2d3a4f;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .disc-icon {
            font-size: 1.5rem;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
            display: inline-block;
        }

        .disc-icon.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .track-title {
            font-weight: 500;
            font-size: 1.15rem;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 3rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #3b4a5e;
            box-shadow: 0 6px 0 #0b1120;
            transform: translateY(0);
        }

        .btn:active {
            box-shadow: 0 2px 0 #0b1120;
            transform: translateY(4px);
        }

        .btn-play {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #3b82f6;
            box-shadow: 0 6px 0 #0e1a2b;
            color: white;
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .btn-stop {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            border-color: #ef4444;
            box-shadow: 0 6px 0 #2b0e0e;
            color: white;
        }

        .btn-stop:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #0b1120;
            transform: translateY(2px);
        }

        .hint {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #64748b;
            background: #0f172a;
            padding: 0.7rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid #1e293b;
            display: inline-block;
            max-width: 100%;
        }

        footer {
            margin-top: 3rem;
            padding: 1.2rem 0 1.5rem;
            border-top: 1px solid #1e293b;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            color: #64748b;
            font-size: 0.85rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            gap: 1rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .footer-links a:hover {
            color: #c084fc;
        }

        .copyright {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .music-card { padding: 1.5rem 1.2rem; }
            .btn { padding: 0.75rem 1.4rem; font-size: 0.95rem; }
            .controls { gap: 1rem; }
            .track-title { max-width: 150px; }
            footer { flex-direction: column; text-align: center; gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>🎧 我的 Apple Music 主页</h1>
        <div class="subhead">授权后即可播放你账户中的音乐</div>

        <div class="music-card">
            <div class="now-playing">
                <span class="disc-icon" id="discIcon">💿</span>
                <span class="track-title" id="trackTitle">等待授权</span>
            </div>

            <div class="controls">
                <button class="btn btn-play" id="playBtn" disabled>
                    <span>▶</span> 播放
                </button>
                <button class="btn btn-stop" id="stopBtn" disabled>
                    <span>⏹</span> 停止
                </button>
            </div>

            <div class="hint" id="statusMessage">
                ⏳ 正在加载 MusicKit...
            </div>
        </div>
    </div>

    <footer>
        <div class="copyright">
            <span>©</span> 2025 我的 GitHub 主页
        </div>
        <div class="footer-links">
            <a href="https://github.com/" target="_blank" rel="noopener">
                <span>🐙</span> GitHub
            </a>
            <a href="#" id="footerInfoLink">
                <span>ℹ️</span> 关于
            </a>
        </div>
    </footer>

    <!-- MusicKit JS v3，注意不要加 async 属性 -->
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>

    <script>
        (function() {
            const playBtn = document.getElementById('playBtn');
            const stopBtn = document.getElementById('stopBtn');
            const trackTitle = document.getElementById('trackTitle');
            const discIcon = document.getElementById('discIcon');
            const statusMessage = document.getElementById('statusMessage');
            const footerInfoLink = document.getElementById('footerInfoLink');

            let music = null;
            let isAuthorized = false;

            function setStatus(text, isError = false) {
                statusMessage.innerHTML = text;
                statusMessage.style.color = isError ? '#f87171' : '#64748b';
            }

            function updateUIForPlaying(isPlaying) {
                if (isPlaying) {
                    discIcon.classList.add('playing');
                    playBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    discIcon.classList.remove('playing');
                    playBtn.disabled = !isAuthorized;
                    stopBtn.disabled = true;
                }
            }

            function getTrackName() {
                if (!music || !music.nowPlayingItem) return '未知曲目';
                const item = music.nowPlayingItem;
                return item.attributes?.name || item.attributes?.albumName || '正在播放';
            }

            function playAppleMusic() {
                if (!music) return;

                // 第一步：授权
                music.authorize().then(() => {
                    isAuthorized = true;
                    setStatus('🔑 授权成功，正在准备播放...');

                    // 第二步：设置播放队列（替换成你的 Apple Music 链接）
                    return music.setQueue({
                        url: 'https://music.apple.com/cn/album/hello-hi-single/1787174372'
                    });
                }).then(() => {
                    // 第三步：播放
                    return music.play();
                }).then(() => {
                    setStatus('🎵 正在播放');
                    updateUIForPlaying(true);
                }).catch(error => {
                    console.error('播放失败:', error);
                    setStatus('⚠️ 播放失败，请检查 Token 或链接', true);
                    updateUIForPlaying(false);
                });
            }

            function stopAppleMusic() {
                if (!music) return;
                music.pause();
                music.player.seekToTime(0);
                updateUIForPlaying(false);
                setStatus('⏸️ 已停止', false);
            }

            // 监听 MusicKit 加载完成
            document.addEventListener('musickitloaded', function() {
                // ⚠️ 替换成你的 Developer Token
                MusicKit.configure({
                    developerToken: 'YOUR_DEVELOPER_TOKEN_HERE',
                    app: {
                        name: 'My GitHub Music Page',
                        build: '1.0.0'
                    }
                });

                music = MusicKit.getInstance();

                // 启用播放按钮
                playBtn.disabled = false;
                setStatus('👆 点击「播放」授权并开始音乐', false);

                // 监听播放状态变化，同步 UI
                music.addEventListener('playbackStateDidChange', () => {
                    const state = music.playbackState;
                    // 2 = playing, 3 = paused
                    if (state === 2) {
                        trackTitle.textContent = getTrackName();
                        updateUIForPlaying(true);
                    } else if (state === 3) {
                        updateUIForPlaying(false);
                    }
                });

                // 监听曲目变化，更新显示
                music.addEventListener('nowPlayingItemDidChange', () => {
                    if (music.playbackState === 2) {
                        trackTitle.textContent = getTrackName();
                    }
                });

                // 监听播放错误
                music.addEventListener('mediaPlaybackError', (error) => {
                    console.error('播放错误:', error);
                    setStatus('❌ 播放出错，请检查控制台', true);
                    updateUIForPlaying(false);
                });
            });

            // 按钮事件
            playBtn.addEventListener('click', playAppleMusic);
            stopBtn.addEventListener('click', stopAppleMusic);

            footerInfoLink.addEventListener('click', (e) => {
                e.preventDefault();
                alert('这是一个演示页面，使用 MusicKit JS 播放 Apple Music。\n请确保已配置有效的 Developer Token 和音乐链接。');
            });
        })();
    </script>
</body>
</html>
