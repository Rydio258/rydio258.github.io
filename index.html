<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMAHA CT-X1 · 复古调谐器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
    background-image: radial-gradient(ellipse at 50% 0%, #333 0%, #111 70%);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    padding: 2rem 1rem;
  }

  /* ============ 主体机箱 ============ */
  .tuner {
    width: 100%;
    max-width: 860px;
    background: #d8d8d8;
    background-image: linear-gradient(180deg, #e8e8e8 0%, #d0d0d0 100%);
    border-radius: 4px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.8),
      inset 0 -1px 0 rgba(0,0,0,0.2);
    padding: 22px 28px;
    position: relative;
    /* 拉丝金属纹理 */
    background-size: 100% 100%, 2px 100%;
    background-blend-mode: normal, overlay;
  }

  .tuner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 1px,
      rgba(0,0,0,0.03) 1px,
      rgba(0,0,0,0.03) 2px
    );
    border-radius: 4px;
    pointer-events: none;
  }

  /* ============ 顶部品牌栏 ============ */
  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #b0b0b0;
  }

  .brand-left {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  .brand-name {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #111;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .brand-model {
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
  }

  .brand-indicators {
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: #555;
  }

  .indicator {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .led {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #333;
    transition: all 0.2s;
  }

  .led.on {
    background: #e33;
    box-shadow: 0 0 8px #e33, inset 0 0 2px rgba(255,255,255,0.6);
  }

  .led.green.on {
    background: #2a2;
    box-shadow: 0 0 8px #2a2, inset 0 0 2px rgba(255,255,255,0.6);
  }

  /* ============ 频率刻度盘 ============ */
  .dial-section {
    background: #f4f4f0;
    border: 1px solid #a0a0a0;
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
    position: relative;
  }

  .dial-display {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .dial-frequency {
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: #111;
    letter-spacing: 1px;
    background: #e8e8e4;
    padding: 2px 12px;
    border-radius: 2px;
    border: 1px solid #b0b0b0;
    min-width: 110px;
    text-align: center;
  }

  .dial-station-name {
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: #c0392b;
    text-transform: uppercase;
    font-weight: 600;
    min-height: 1.1em;
  }

  .dial-band-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.55rem;
    color: #666;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  /* FM 刻度 */
  .fm-scale {
    position: relative;
    height: 28px;
    margin-bottom: 4px;
    background: #fafaf8;
    border-top: 1px solid #999;
    border-bottom: 1px solid #ccc;
  }

  .fm-ticks {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .fm-tick {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
  }

  .fm-tick .line {
    width: 1px;
    height: 8px;
    background: #444;
  }

  .fm-tick.major .line {
    height: 14px;
    background: #111;
    width: 1.5px;
  }

  .fm-tick .num {
    font-size: 0.5rem;
    color: #333;
    margin-top: 2px;
    font-family: 'Courier New', monospace;
  }

  .fm-tick.red .line {
    background: #c0392b;
  }

  /* AM 刻度 */
  .am-scale {
    position: relative;
    height: 24px;
    background: #fafaf8;
    border-top: 1px solid #999;
    border-bottom: 1px solid #ccc;
  }

  .am-ticks {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .am-tick {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
  }

  .am-tick .line {
    width: 1px;
    height: 6px;
    background: #444;
  }

  .am-tick.major .line {
    height: 12px;
    background: #111;
    width: 1.5px;
  }

  .am-tick .num {
    font-size: 0.45rem;
    color: #333;
    margin-top: 1px;
    font-family: 'Courier New', monospace;
  }

  /* 指针 */
  .needle {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: #c0392b;
    box-shadow: 0 0 4px rgba(192,57,43,0.6);
    transition: left 0.05s linear;
    z-index: 5;
  }

  .needle::before {
    content: '';
    position: absolute;
    top: -2px; left: -3px;
    width: 8px; height: 8px;
    background: #c0392b;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  /* ============ 中间控制区 ============ */
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .control-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* 电源开关 */
  .switch {
    width: 34px;
    height: 18px;
    background: #b0b0b0;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    border: 1px solid #888;
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 1px; left: 1px;
    width: 14px; height: 14px;
    background: linear-gradient(180deg, #eee, #999);
    border-radius: 2px;
    transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  .switch.on::after {
    transform: translateX(16px);
    background: linear-gradient(180deg, #fff, #bbb);
  }

  /* 输出电平旋钮 */
  .small-knob {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0f0f0, #999 60%, #666);
    border: 2px solid #888;
    position: relative;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(0,0,0,0.3);
  }

  .small-knob::after {
    content: '';
    position: absolute;
    top: 3px; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 12px;
    background: #111;
    border-radius: 1px;
  }

  /* 功能拨动开关 */
  .toggle-switch {
    width: 30px;
    height: 22px;
    background: #b0b0b0;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    border: 1px solid #888;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 16px;
    background: linear-gradient(180deg, #eee, #999);
    border-radius: 2px;
    transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  .toggle-switch.on::after {
    transform: translateX(14px);
  }

  /* ============ 表头 ============ */
  .meters-group {
    display: flex;
    gap: 10px;
    flex: 1;
    justify-content: center;
  }

  .meter {
    width: 110px;
    background: #f4f4f0;
    border: 1px solid #999;
    border-radius: 3px;
    padding: 4px 6px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  }

  .meter-label {
    font-size: 0.5rem;
    letter-spacing: 1px;
    color: #555;
    text-align: center;
    margin-bottom: 2px;
    font-weight: 600;
  }

  .meter-svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ============ 大调谐旋钮 ============ */
  .big-knob-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .big-knob {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f5f5f5, #b0b0b0 50%, #777 90%);
    border: 2px solid #999;
    position: relative;
    cursor: grab;
    box-shadow:
      0 8px 16px rgba(0,0,0,0.5),
      inset 0 -4px 8px rgba(0,0,0,0.3),
      inset 0 4px 8px rgba(255,255,255,0.6);
  }

  .big-knob:active { cursor: grabbing; }

  .big-knob::after {
    content: '';
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 3px; height: 26px;
    background: #111;
    border-radius: 2px;
    box-shadow: 0 0 3px rgba(0,0,0,0.5);
  }

  /* 旋钮防滑纹 */
  .big-knob::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      transparent 0deg 4deg,
      rgba(0,0,0,0.08) 4deg 6deg
    );
    pointer-events: none;
  }

  .knob-hint {
    font-size: 0.5rem;
    color: #777;
    letter-spacing: 1px;
  }

  /* ============ 底部信息 ============ */
  footer {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 860px;
    padding: 0 8px;
    font-size: 0.65rem;
    color: #666;
    letter-spacing: 1px;
    flex-wrap: wrap;
    gap: 10px;
  }

  footer a { color: #888; text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: #c0392b; }
  .footer-links { display: flex; gap: 18px; }

  /* ============ 响应式 ============ */
  @media (max-width: 700px) {
    .tuner { padding: 14px 16px; }
    .brand-name { font-size: 1rem; }
    .brand-model { display: none; }
    .control-row { flex-wrap: wrap; gap: 12px; }
    .meters-group { order: -1; width: 100%; justify-content: space-around; }
    .meter { width: 45%; }
    .big-knob { width: 70px; height: 70px; }
    .big-knob::after { height: 20px; }
    .fm-tick .num, .am-tick .num { font-size: 0.4rem; }
  }
</style>
</head>
<body>

<div class="tuner">
  <!-- 顶部品牌 -->
  <div class="brand-row">
    <div class="brand-left">
      <div class="brand-name">YAMAHA</div>
      <div class="brand-model">Natural Sound AM/FM Stereo Tuner · CT-X1</div>
    </div>
    <div class="brand-indicators">
      <div class="indicator">
        <span class="led green" id="ledStereo"></span> FM STEREO
      </div>
      <div class="indicator">
        <span class="led" id="ledPower"></span> POWER
      </div>
    </div>
  </div>

  <!-- 频率刻度盘 -->
  <div class="dial-section">
    <div class="dial-display">
      <div class="dial-frequency" id="freqDisplay">--.- MHz</div>
      <div class="dial-station-name" id="stationName">NO SIGNAL</div>
    </div>

    <div class="dial-band-labels">
      <span>FM</span>
      <span>MHz</span>
    </div>
    <div class="fm-scale" id="fmScale">
      <div class="fm-ticks" id="fmTicks"></div>
      <div class="needle" id="needle"></div>
    </div>

    <div class="dial-band-labels" style="margin-top:4px;">
      <span>AM</span>
      <span>kHz</span>
    </div>
    <div class="am-scale" id="amScale">
      <div class="am-ticks" id="amTicks"></div>
    </div>
  </div>

  <!-- 控制区 + 表头 + 大旋钮 -->
  <div class="control-row">
    <!-- 电源 -->
    <div class="control-group">
      <div class="control-label">POWER</div>
      <div class="switch" id="powerSwitch"></div>
    </div>

    <!-- 输出电平 -->
    <div class="control-group">
      <div class="control-label">OUTPUT</div>
      <div class="small-knob" id="volumeKnob"></div>
    </div>

    <!-- 功能开关 -->
    <div class="control-group">
      <div class="control-label">FUNCTION</div>
      <div class="toggle-switch" id="funcSwitch"></div>
    </div>

    <!-- 双表头 -->
    <div class="meters-group">
      <div class="meter">
        <div class="meter-label">SIGNAL</div>
        <svg class="meter-svg" id="signalMeter" viewBox="0 0 100 55"></svg>
      </div>
      <div class="meter">
        <div class="meter-label">FM TUNING</div>
        <svg class="meter-svg" id="tuningMeter" viewBox="0 0 100 55"></svg>
      </div>
    </div>

    <!-- 大调谐旋钮 -->
    <div class="big-knob-container">
      <div class="big-knob" id="tuningKnob"></div>
      <div class="knob-hint">TUNING</div>
    </div>
  </div>
</div>

<footer>
  <div>© 2025 我的 GitHub 主页</div>
  <div class="footer-links">
    <a href="https://github.com/" target="_blank" rel="noopener">GITHUB</a>
    <a href="#" id="footerInfoLink">ABOUT</a>
  </div>
</footer>

<audio id="bgMusic" preload="auto"></audio>

<script>
(function() {
  // ==================== 电台配置 ====================
  // 频率范围: FM 76.0 - 108.0 MHz
  // 每个电台代表一个"文件夹"，包含该文件夹下的歌曲列表
  const stations = [
    {
      freq: 88.1,
      name: 'JAY CHOU',
      songs: ['music/jay/晴天.mp3', 'music/jay/七里香.mp3', 'music/jay/稻香.mp3']
    },
    {
      freq: 92.4,
      name: 'JJ LIN',
      songs: ['music/jj/江南.mp3', 'music/jj/曹操.mp3', 'music/jj/不为谁而作的歌.mp3']
    },
    {
      freq: 98.7,
      name: 'EASON CHAN',
      songs: ['music/eason/十年.mp3', 'music/eason/浮夸.mp3', 'music/eason/富士山下.mp3']
    },
    {
      freq: 104.2,
      name: 'CLASSICAL',
      songs: ['music/classical/卡农.mp3', 'music/classical/月光.mp3', 'music/classical/致爱丽丝.mp3']
    }
  ];

  const FM_MIN = 76.0, FM_MAX = 108.0;
  const AM_MIN = 520, AM_MAX = 1600;
  // ==================================================

  const audio = document.getElementById('bgMusic');
  const freqDisplay = document.getElementById('freqDisplay');
  const stationName = document.getElementById('stationName');
  const needle = document.getElementById('needle');
  const powerSwitch = document.getElementById('powerSwitch');
  const ledPower = document.getElementById('ledPower');
  const ledStereo = document.getElementById('ledStereo');
  const volumeKnob = document.getElementById('volumeKnob');
  const funcSwitch = document.getElementById('funcSwitch');
  const tuningKnob = document.getElementById('tuningKnob');
  const footerInfoLink = document.getElementById('footerInfoLink');

  let isPowered = false;
  let currentFreq = 88.1;
  let currentStation = null;
  let isPlaying = false;
  let currentSongIndex = 0;
  let audioContext = null;
  let analyser = null;
  let dataArray = null;
  let signalNeedle, tuningNeedle;
  let volumeLevel = 0.7;

  // ============ 构建表头 ============
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function buildMeter(svg, color, label) {
    // 背景
    const bg = document.createElementNS(SVG_NS, 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', 100); bg.setAttribute('height', 55);
    bg.setAttribute('rx', 2);
    bg.setAttribute('fill', '#fafaf5');
    svg.appendChild(bg);

    // 弧线
    const arc = document.createElementNS(SVG_NS, 'path');
    arc.setAttribute('d', 'M 10 45 A 40 40 0 0 1 90 45');
    arc.setAttribute('fill', 'none');
    arc.setAttribute('stroke', '#444');
    arc.setAttribute('stroke-width', '1');
    svg.appendChild(arc);

    // 刻度线
    for (let i = 0; i <= 8; i++) {
      const angle = -45 + i * (90 / 8);
      const rad = angle * Math.PI / 180;
      const r1 = 36, r2 = 40;
      const cx = 50, cy = 45;
      const x1 = cx + r1 * Math.sin(rad);
      const y1 = cy - r1 * Math.cos(rad);
      const x2 = cx + r2 * Math.sin(rad);
      const y2 = cy - r2 * Math.cos(rad);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#444');
      line.setAttribute('stroke-width', i % 4 === 0 ? '1.2' : '0.6');
      svg.appendChild(line);
    }

    // 指针
    const needleEl = document.createElementNS(SVG_NS, 'line');
    needleEl.setAttribute('x1', 50);
    needleEl.setAttribute('y1', 45);
    needleEl.setAttribute('x2', 50);
    needleEl.setAttribute('y2', 12);
    needleEl.setAttribute('stroke', color);
    needleEl.setAttribute('stroke-width', '1.5');
    needleEl.setAttribute('stroke-linecap', 'round');
    needleEl.setAttribute('transform', 'rotate(-45 50 45)');
    svg.appendChild(needleEl);

    // 轴心
    const pivot = document.createElementNS(SVG_NS, 'circle');
    pivot.setAttribute('cx', 50); pivot.setAttribute('cy', 45);
    pivot.setAttribute('r', 3);
    pivot.setAttribute('fill', '#333');
    svg.appendChild(pivot);

    return needleEl;
  }

  signalNeedle = buildMeter(document.getElementById('signalMeter'), '#111');
  tuningNeedle = buildMeter(document.getElementById('tuningMeter'), '#c0392b');

  // ============ 构建刻度 ============
  function buildFMScale() {
    const container = document.getElementById('fmTicks');
    const total = 32; // 76-108 共 32 个 MHz
    for (let i = 0; i <= total; i++) {
      const freq = FM_MIN + i;
      const tick = document.createElement('div');
      tick.className = 'fm-tick' + (i % 5 === 0 ? ' major' : '') + (freq >= 88 && freq <= 108 ? '' : '');
      const line = document.createElement('div');
      line.className = 'line';
      tick.appendChild(line);
      if (i % 2 === 0) {
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = freq;
        tick.appendChild(num);
      }
      container.appendChild(tick);
    }
  }

  function buildAMScale() {
    const container = document.getElementById('amTicks');
    const total = 10;
    for (let i = 0; i <= total; i++) {
      const freq = AM_MIN + i * (AM_MAX - AM_MIN) / total;
      const tick = document.createElement('div');
      tick.className = 'am-tick' + (i % 1 === 0 ? ' major' : '');
      const line = document.createElement('div');
      line.className = 'line';
      tick.appendChild(line);
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = Math.round(freq);
      tick.appendChild(num);
      container.appendChild(tick);
    }
  }

  buildFMScale();
  buildAMScale();

  // ============ 音频分析 ============
  function initAudioContext() {
    if (audioContext) {
      if (audioContext.state === 'suspended') audioContext.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    audioContext = new AC();
    const source = audioContext.createMediaElementSource(audio);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    dataArray = new Uint8Array(analyser.fftSize);
    requestAnimationFrame(animateMeters);
  }

  function animateMeters() {
    if (analyser && dataArray) {
      analyser.getByteTimeDomainData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = (dataArray[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / dataArray.length);
      const db = 20 * Math.log10(rms + 0.0001);
      let t = (db + 35) / 35;
      if (t < 0) t = 0;
      if (t > 1) t = 1;
      const angle = -45 + t * 90;
      signalNeedle.setAttribute('transform', 'rotate(' + angle + ' 50 45)');
    }
    requestAnimationFrame(animateMeters);
  }

  // ============ 调谐逻辑 ============
  function freqToNeedlePercent(freq) {
    return ((freq - FM_MIN) / (FM_MAX - FM_MIN)) * 100;
  }

  function updateTuning(freq) {
    // 限制范围
    if (freq < FM_MIN) freq = FM_MIN;
    if (freq > FM_MAX) freq = FM_MAX;
    currentFreq = freq;

    // 更新数字显示
    freqDisplay.textContent = freq.toFixed(1) + ' MHz';

    // 更新指针位置
    needle.style.left = freqToNeedlePercent(freq) + '%';

    // 检查是否命中电台
    let found = null;
    for (const st of stations) {
      if (Math.abs(freq - st.freq) < 0.5) {
        found = st;
        break;
      }
    }

    if (found) {
      currentStation = found;
      stationName.textContent = found.name;
      stationName.style.color = '#c0392b';
      ledStereo.classList.add('on');

      // 调谐表指针居中
      const offset = (freq - found.freq) / 0.5; // -1 到 1
      tuningNeedle.setAttribute('transform', 'rotate(' + (offset * 15) + ' 50 45)');

      // 如果已开机且换台了，播放新电台
      if (isPowered) {
        if (!isPlaying || audio.src.indexOf(found.songs[0]) === -1) {
          playStation(found);
        }
      }
    } else {
      currentStation = null;
      stationName.textContent = 'NO SIGNAL';
      stationName.style.color = '#999';
      ledStereo.classList.remove('on');
      tuningNeedle.setAttribute('transform', 'rotate(0 50 45)');

      if (isPowered && isPlaying) {
        audio.pause();
        isPlaying = false;
      }
    }
  }

  function playStation(station) {
    if (!station || station.songs.length === 0) return;
    currentSongIndex = Math.floor(Math.random() * station.songs.length);
    playSong(station.songs[currentSongIndex]);
  }

  function playSong(path) {
    initAudioContext();
    audio.src = path;
    audio.volume = volumeLevel;
    const promise = audio.play();
    if (promise !== undefined) {
      promise.then(() => {
        isPlaying = true;
      }).catch(err => {
        console.warn('播放失败:', err);
        isPlaying = false;
      });
    }
  }

  function nextSong() {
    if (currentStation && currentStation.songs.length > 0) {
      currentSongIndex = (currentSongIndex + 1) % currentStation.songs.length;
      playSong(currentStation.songs[currentSongIndex]);
    }
  }

  // ============ 交互事件 ============
  // 电源开关
  powerSwitch.addEventListener('click', () => {
    isPowered = !isPowered;
    powerSwitch.classList.toggle('on', isPowered);
    ledPower.classList.toggle('on', isPowered);

    if (isPowered) {
      updateTuning(currentFreq);
    } else {
      audio.pause();
      isPlaying = false;
      stationName.textContent = 'POWER OFF';
      stationName.style.color = '#999';
      ledStereo.classList.remove('on');
    }
  });

  // 音量旋钮（简化为点击循环调节）
  volumeKnob.addEventListener('click', () => {
    volumeLevel = volumeLevel >= 0.9 ? 0.2 : volumeLevel + 0.25;
    audio.volume = volumeLevel;
  });

  // 功能开关（切换下一首）
  funcSwitch.addEventListener('click', () => {
    funcSwitch.classList.toggle('on');
    nextSong();
  });

  // 大旋钮拖动调谐
  let isDragging = false;
  let startY = 0;
  let startFreq = 0;

  tuningKnob.addEventListener('mousedown', (e) => {
    if (!isPowered) return;
    isDragging = true;
    startY = e.clientY;
    startFreq = currentFreq;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaY = startY - e.clientY;
    const freqDelta = deltaY * 0.05; // 灵敏度
    updateTuning(startFreq + freqDelta);
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // 鼠标滚轮调谐
  tuningKnob.addEventListener('wheel', (e) => {
    if (!isPowered) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.2 : 0.2;
    updateTuning(currentFreq + delta);
  }, { passive: false });

  // 触摸支持
  tuningKnob.addEventListener('touchstart', (e) => {
    if (!isPowered) return;
    isDragging = true;
    startY = e.touches[0].clientY;
    startFreq = currentFreq;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const deltaY = startY - e.touches[0].clientY;
    updateTuning(startFreq + deltaY * 0.05);
  }, { passive: false });

  document.addEventListener('touchend', () => {
    isDragging = false;
  });

  // 播放结束 → 自动下一首
  audio.addEventListener('ended', () => {
    if (isPowered && currentStation) {
      nextSong();
    }
  });

  // 页脚关于
  footerInfoLink.addEventListener('click', (e) => {
    e.preventDefault();
    alert('YAMAHA CT-X1 复古调谐器\n\n· 打开 POWER 开关\n· 拖动右侧大旋钮或滚动滚轮调节频率\n· 当频率对准电台时，自动播放对应文件夹的歌曲\n· 点击 FUNCTION 开关可切换下一首');
  });

  // 初始化
  updateTuning(88.1);
  audio.volume = volumeLevel;
})();
</script>

</body>
</html>
